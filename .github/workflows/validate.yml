name: validate

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
        include:
          # Floor check for the "Python 3.8+" claim. 3.8 isn't installable on
          # macos-latest (arm64) or ubuntu-24.04, so it runs on ubuntu-22.04 only.
          - os: ubuntu-22.04
            python: "3.8"
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Run skill test suite (scripts + structure)
        run: python tests/test_scripts.py

      - name: Check evals, versions and Ghidra script sync
        run: python tests/test_meta.py

  lint-frontmatter:
    name: validate SKILL.md frontmatter
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check YAML frontmatter parses and fits the spec
        run: |
          python - <<'PY'
          import re, sys, pathlib
          try:
              import yaml
          except ImportError:
              import subprocess
              subprocess.check_call([sys.executable, "-m", "pip", "install", "pyyaml"])
              import yaml
          p = pathlib.Path("skills/reverse-engineering/SKILL.md")
          text = p.read_text(encoding="utf-8")
          m = re.match(r"^---\n(.*?)\n---\n", text, re.S)
          assert m, "frontmatter must start on line 1"
          fm = yaml.safe_load(m.group(1))
          # Only the six portable Agent Skills fields are allowed outside Claude Code.
          allowed = {"name", "description", "license", "compatibility", "metadata", "allowed-tools"}
          extra = set(fm) - allowed
          assert not extra, f"non-portable frontmatter keys: {extra}"
          assert re.fullmatch(r"[a-z0-9]+(-[a-z0-9]+)*", fm["name"]), "name must be lowercase-hyphen"
          assert 1 <= len(fm["description"]) <= 1024, "description must be 1-1024 chars"
          if "compatibility" in fm:
              assert len(fm["compatibility"]) <= 500, "compatibility max 500 chars"
          print("frontmatter OK:", fm["name"])
          PY

  # Runs the bundled Ghidra export against a real Ghidra release, so the
  # headless path stays verified (Ghidra pinned and checksum-checked).
  ghidra-export:
    name: Ghidra headless export (real Ghidra 12.1.4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GHIDRA_SHA256: ddac49f903da9d5bac833e5cc79395098b9c33cfd3279be5f31bd00387d2d4db
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # Fetched by a release-download action, so the repository holds no shell
      # download command; the checksum below still pins the exact release.
      - name: Download Ghidra release
        uses: robinraju/release-downloader@28fc21f50d76778e7023361aa1f863e717d3d56f # v1.13
        with:
          repository: NationalSecurityAgency/ghidra
          tag: Ghidra_12.1.4_build
          fileName: ghidra_12.1.4_PUBLIC_20260921.zip
          out-file-path: ghidra-dl

      - name: Verify and unpack Ghidra
        run: |
          mv ghidra-dl/ghidra_12.1.4_PUBLIC_20260921.zip "$RUNNER_TEMP/ghidra.zip"
          echo "$GHIDRA_SHA256  $RUNNER_TEMP/ghidra.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/ghidra.zip" -d "$RUNNER_TEMP"
          G="$RUNNER_TEMP/ghidra_12.1.4_PUBLIC"
          chmod +x "$G"/support/*.sh "$G/support/analyzeHeadless"
          find "$G/Ghidra" -path '*/os/linux_x86_64/*' -type f -exec chmod +x {} +

      # Same commands as SKILL.md step 6 and native-binaries.md#ghidra-workflow.
      - name: Export a real binary with DecompileExport.java
        run: |
          GHIDRA_INSTALL_DIR="$RUNNER_TEMP/ghidra_12.1.4_PUBLIC"
          mkdir -p "$RUNNER_TEMP/sample"
          cp /usr/bin/true "$RUNNER_TEMP/sample/target"
          P=$(mktemp -d "${TMPDIR:-/tmp}/ghproj.XXXXXX")
          echo "P=$P" >> "$GITHUB_ENV"
          # -deleteProject left off so the next step can re-export from this project.
          "$GHIDRA_INSTALL_DIR/support/analyzeHeadless" "$P" re -import "$RUNNER_TEMP/sample/target" \
            -scriptPath skills/reverse-engineering/scripts/ghidra -log "$P/headless.log" \
            -postScript DecompileExport.java "$P/decomp.txt"
          # analyzeHeadless exits 0 even if the script fails, so check the output itself.
          test -s "$P/headless.log"
          test -s "$P/decomp.txt"
          grep -q "^-- IMPORTS" "$P/decomp.txt"
          grep -q "^-- MOST CALLED FUNCTIONS" "$P/decomp.txt"
          grep -q "^-- FUNCTIONS CALLING NOTABLE APIs" "$P/decomp.txt"
          tail -1 "$P/decomp.txt" | grep -E '^/\* exported [1-9][0-9]* functions'

      - name: Re-export without re-analysis (name filter + function cap)
        run: |
          GHIDRA_INSTALL_DIR="$RUNNER_TEMP/ghidra_12.1.4_PUBLIC"
          "$GHIDRA_INSTALL_DIR/support/analyzeHeadless" "$P" re -process target -noanalysis \
            -scriptPath skills/reverse-engineering/scripts/ghidra -log "$P/reexport.log" \
            -postScript DecompileExport.java "$P/re.txt" fun_ 3
          grep -q "name contains 'fun_'" "$P/re.txt"
          tail -1 "$P/re.txt" | grep -E '^/\* exported [1-3] functions'
          rm -rf "$P"

  # Validates both manifests with a pinned Claude Code CLI (no login needed).
  plugin-validate:
    name: claude plugin validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.156

      # stdin closed: the CLI can otherwise wait on it in CI.
      - name: claude plugin validate
        run: |
          claude plugin validate . < /dev/null
          claude plugin validate .claude-plugin/plugin.json < /dev/null
